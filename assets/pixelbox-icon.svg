<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGlass" x1="248" y1="130" x2="802" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FD4FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7FF2D0" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="logoShine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(232 228) rotate(44) scale(390)">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pixelFill" x1="512" y1="235" x2="512" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7FD4FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="logoShadow" x="40" y="54" width="944" height="944" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <rect x="96" y="96" width="832" height="832" rx="297" fill="#0F1E33"/>
    <rect x="96" y="96" width="832" height="832" rx="297" fill="url(#logoGlass)"/>
    <rect x="96" y="96" width="832" height="832" rx="297" fill="url(#logoShine)"/>
    <rect x="97" y="97" width="830" height="830" rx="296" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

    <rect x="235" y="235" width="248" height="248" rx="124" fill="url(#pixelFill)"/>
    <rect x="542" y="235" width="248" height="248" rx="124" fill="url(#pixelFill)"/>
    <rect x="235" y="641" width="248" height="149" rx="74.5" fill="url(#pixelFill)"/>
    <rect x="542" y="641" width="248" height="149" rx="74.5" fill="url(#pixelFill)"/>
  </g>
</svg>
